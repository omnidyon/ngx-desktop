@for (window of desktop.dockWindows(); track window.id) {
  <button
    type="button"
    class="omni-dock-tab"
    [attr.data-window-id]="window.id"
    [class.omni-dock-tab-minimized]="window.minimized()"
    [class.omni-dock-tab-focused]="desktop.focusedId() === window.id && !window.minimized()"
    [attr.aria-label]="window.header() || labels().untitledWindow"
    [attr.title]="window.header() || null"
    (click)="activate(window)"
  >
    @if (window.icon(); as src) {
      <img class="omni-dock-icon" [src]="src" alt="" />
    } @else {
      <span class="omni-dock-label">{{ window.header() }}</span>
    }
  </button>
}
